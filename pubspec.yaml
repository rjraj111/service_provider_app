name: utsho
description: Utsho - A local service provider platform connecting users with technicians and professionals.
publish_to: 'none'
version: 1.0.0+1
environment:
  sdk: '>=3.2.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # ── State Management ──────────────────────────────────────────
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  # ── Routing ───────────────────────────────────────────────────
  go_router: ^18.0.1
  # ── Video Player ──────────────────────────────────────────────
  video_player: ^2.14.0
  chewie: ^1.17.2
  # ── Voice / Speech Recognition ────────────────────────────────
  speech_to_text: ^7.5.0
  # ── Networking & Data ─────────────────────────────────────────
  dio: ^5.7.0
  cached_network_image: ^4.0.3
  # ── UI & Design ───────────────────────────────────────────────
  google_fonts: ^8.2.1
  flutter_svg: ^2.3.0
  shimmer: ^3.0.0
  flutter_animate: ^4.5.2
  smooth_page_indicator: ^1.2.0
  # ── Utilities ─────────────────────────────────────────────────
  intl: ^0.20.3
  uuid: ^4.6.0
  equatable: ^2.0.5
  json_annotation: ^4.9.0
  # ── Local Storage ─────────────────────────────────────────────
  shared_preferences: ^2.3.1
  flutter_secure_storage: ^10.0.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.12
  riverpod_generator: ^2.4.3
  json_serializable: ^6.8.0
  freezed: ^2.5.2
  freezed_annotation: ^2.4.4
flutter:
  generate: true
  uses-material-design: true
  assets:
    - lib/assets/images/